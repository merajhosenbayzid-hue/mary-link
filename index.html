<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mary | Link</title>
<meta name="description" content="To talk to me on a video call, click Contact Me here and wait 10 seconds. Share 5 times and the video call will come automatically.">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f172a; color: #fff; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 40px; text-align: center; }
  .avatar { width: 128px; height: 128px; object-fit: cover; object-position: top center; border-radius: 50%; display: block; margin: 0 auto 18px; }
  h1 { margin: 0 0 12px; font-size: 32px; }
  .bio { margin: 0 auto 28px; max-width: 520px; font-size: 17px; line-height: 1.55; color: #e2e8f0; }
  a.card, a.pill { display: block; color: #fff; text-decoration: none; background: #334155; border-radius: 24px; overflow: hidden; }
  a.card { margin-bottom: 18px; }
  a.card img { width: 100%; height: 380px; object-fit: cover; object-position: center; display: block; }
  a.card span, a.pill span { display: block; padding: 18px; font-size: 18px; font-weight: 600; }
  a.pill { display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px 18px 10px 10px; border-radius: 999px; }
  a.pill img { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; flex: none; }
  a.pill span { padding: 0; }
  a.card:hover, a.pill:hover { background: #475569; }
  .foot { margin-top: 36px; font-size: 13px; color: #94a3b8; }
  @media (max-width: 480px) { a.card img { height: 300px; } }
</style>
</head>
<body>
  <main class="wrap">
    <img class="avatar" src="avatar.png" alt="Mary">
    <h1>Mary</h1>
    <p class="bio">To talk to me on a video call, click Contact Me here and wait 10 seconds. Share 5 times and the video call will come automatically.</p>
    <a class="card" href="https://auctionr.org/4/9270c68745049a1e18a7c2fb78801da2" target="_blank" rel="noopener">
      <img src="card.png" alt="Mary">
      <span>Contact Me here:</span>
    </a>
    <a class="pill" href="https://auctionr.org/4/8f6a566096e324e84ae5c53eb0df6519" target="_blank" rel="noopener">
      <img src="photo.png" alt="Mary">
      <span>Contact Me here:</span>
    </a>
    <p class="foot">Mary</p>
  </main>
</body>
</html>
